---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: litellm
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      initContainers:
        - name: fetch-anthropic-key
          image: docker.io/hashicorp/vault:2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
          command: ["/bin/sh", "-euc"]
          args:
            - |
              umask 077
              VAULT_TOKEN="$(vault write -field=token "auth/kubernetes/login" role="$VAULT_ROLE" jwt=@/var/run/secrets/vault/token)"
              export VAULT_TOKEN
              vault kv get -mount="$VAULT_KV_MOUNT" -field=api_key "$VAULT_KV_PATH" > /vault/secrets/anthropic_api_key
              vault token revoke -self >/dev/null
              case "$(head -c 10 /vault/secrets/anthropic_api_key)" in
                sk-ant-api) ;;
                *) echo "fetch-anthropic-key: $VAULT_KV_MOUNT/$VAULT_KV_PATH api_key is not a Console API key (sk-ant-api...)" >&2; exit 1 ;;
              esac
              echo "fetch-anthropic-key: staged $VAULT_KV_MOUNT/$VAULT_KV_PATH"
          env:
            - name: VAULT_ADDR
              value: "https://vault-active.vault.svc:8200"
            - name: VAULT_CACERT
              value: "/var/run/vault-ca/ca.crt"
            - name: VAULT_ROLE
              value: "litellm"
            - name: VAULT_KV_MOUNT
              value: "secret"
            - name: VAULT_KV_PATH
              value: "litellm/anthropic"
            - name: HOME
              value: "/tmp"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
            - name: vault-ca
              mountPath: /var/run/vault-ca
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
            - name: tmp
              mountPath: /tmp
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.80.5-stable@sha256:e9711f484c7c8462c028803130afef546aa54c8d2fc11120242c01bbadc12e65
          command:
            - "/bin/sh"
            - "-ec"
            - 'ANTHROPIC_API_KEY="$(cat /vault/secrets/anthropic_api_key)"; export ANTHROPIC_API_KEY; exec /app/docker/prod_entrypoint.sh "$@"'
            - "litellm"
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
            - "--telemetry"
            - "False"
          env:
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
          envFrom:
            - secretRef:
                name: litellm-secret
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: vault-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 600
        - name: vault-ca
          secret:
            secretName: litellm-vault-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
