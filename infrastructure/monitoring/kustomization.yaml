---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alertmanager-slack.sops.yaml
  - grafana-admin.sops.yaml
  - grafana-oidc.sops.yaml
  - kube-prometheus-stack.yaml
  - victoriametrics.yaml
  - vmalert.yaml
  - vmbackup-cronjob.yaml
  - vm-write-auth.sops.yaml
  - vm-write-ingress.yaml
configMapGenerator:
  - name: grafana-dashboard-cluster-overview
    namespace: monitoring
    files:
      - cluster-overview.json=dashboards/cluster-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
