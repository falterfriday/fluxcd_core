---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smtp-relay-tls
  namespace: smtp-relay
spec:
  secretName: smtp-relay-tls
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  commonName: smtp.core.stplabs.io
  dnsNames:
    - smtp.core.stplabs.io
  issuerRef:
    name: cloudflare-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
