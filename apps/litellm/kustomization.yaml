---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - namespace.yaml
  - rbac.yaml
  - certificate.yaml
  - litellm-secret.sops.yaml
  - networkpolicy.yaml
  - service.yaml
  - deployment.yaml
  - pdb.yaml
  - ingress.yaml
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
