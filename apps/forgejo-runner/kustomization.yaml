apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo-runner
resources:
  - namespace.yaml
  - registration-token.sops.yaml
  - deployment.yaml
configMapGenerator:
  - name: forgejo-runner-config
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: true
