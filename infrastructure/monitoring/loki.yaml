---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
        s3:
          endpoint: rustfs.internal.stplabs.io
          region: us-east-1
          accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
          secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
          s3ForcePathStyle: true
          insecure: false
      schemaConfig:
        configs:
          - from: "2026-09-15"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 720h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        volume_enabled: true
        max_query_series: 10000
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: s3
    singleBinary:
      replicas: 1
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: loki-s3-creds
      persistence:
        enabled: true
        storageClass: ceph-block
        size: 10Gi
        whenDeleted: Retain
        whenScaled: Retain
        enableStatefulSetAutoDeletePVC: false
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    gateway:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
