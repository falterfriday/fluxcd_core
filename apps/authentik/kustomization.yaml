---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secrets.sops.yaml
  - db-backup-s3-creds.sops.yaml
  - blueprints-oidc.sops.yaml
  - blueprints-oidc-grafana.sops.yaml
  - blueprints-oidc-vault.sops.yaml
  - cnpg-cluster.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: authentik-blueprints
    namespace: authentik
    files:
      - blueprints/foundation.yaml
    options:
      disableNameSuffixHash: true
