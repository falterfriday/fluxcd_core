---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.46.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    server:
      retentionPeriod: 30d
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 80Gi
        accessModes:
          - ReadWriteOnce
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 300m
          memory: 1Gi
        limits:
          memory: 3Gi
      extraArgs:
        maxLabelsPerTimeseries: "40"
        search.maxQueryDuration: 60s
        # Required for HA Prometheus agent pairs (internal runs 2 replicas so a
        # single node failure can't blind monitoring). Keeps one sample per series
        # per 30s window. Global: jobs scraped faster than 30s (kubelet, rook-ceph)
        # are stored at 30s resolution. Must be deployed BEFORE the internal agent
        # goes to 2 replicas, otherwise sum()/count() over internal series double.
        dedup.minScrapeInterval: 30s
      statefulSet:
        enabled: true
      serviceMonitor:
        enabled: true
