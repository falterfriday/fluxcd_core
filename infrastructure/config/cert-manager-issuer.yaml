---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare-cluster-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: patrick.a.todd@gmail.com
    privateKeySecretRef:
      name: cluster-issuer-account-key
    solvers:
      - dns01:
          cloudflare:
            email: patrick.a.todd@gmail.com
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
