apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmalert
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-alert
      version: 0.48.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    server:
      datasource:
        url: http://victoriametrics-victoria-metrics-single-server.monitoring.svc:8428
      notifiers:
      - url: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
      extraArgs:
        evaluationInterval: 60s
        external.label: k8s_cluster=internal
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          memory: 256Mi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      config:
        alerts:
          groups:
          - name: internal-cluster
            interval: 60s
            rules:
            - alert: InternalNodeDown
              expr: up{k8s_cluster="internal", job="node-exporter"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: Node {{ $labels.instance }} is down
                description: node-exporter on {{ $labels.instance }} has been unreachable for 5 minutes.
            - alert: InternalNodeNotReady
              expr: kube_node_status_condition{k8s_cluster="internal", condition="Ready", status="true"} == 0
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: Node {{ $labels.node }} is not Ready
                description: Node {{ $labels.node }} has been NotReady for 10 minutes.
            - alert: InternalNodeMemoryPressure
              expr: (node_memory_MemAvailable_bytes{k8s_cluster="internal"} / node_memory_MemTotal_bytes{k8s_cluster="internal"})
                < 0.10
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Node {{ $labels.instance }} is low on memory
                description: Less than 10% memory available on {{ $labels.instance }} for 15 minutes.
            - alert: InternalNodeDiskFilling
              expr: (node_filesystem_avail_bytes{k8s_cluster="internal", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{k8s_cluster="internal",
                fstype!~"tmpfs|overlay"}) < 0.10
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is nearly full
                description: Less than 10% free on {{ $labels.mountpoint }}.
            - alert: InternalPodCrashLooping
              expr: increase(kube_pod_container_status_restarts_total{k8s_cluster="internal"}[15m]) > 3
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping
                description: Container {{ $labels.container }} has restarted more than 3 times in 15 minutes.
          - name: internal-cnpg
            interval: 60s
            rules:
            - alert: CNPGInstanceDown
              expr: up{k8s_cluster="internal", container="postgres", endpoint="metrics"} == 0 or cnpg_collector_up{k8s_cluster="internal"}
                == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: Postgres instance {{ $labels.namespace }}/{{ $labels.pod }} is down
                description: The CNPG metrics endpoint for {{ $labels.namespace }}/{{ $labels.pod }} has been unreachable or
                  reporting the collector down for 5 minutes.
            - alert: CNPGWALArchivingStuck
              expr: cnpg_collector_pg_wal_archive_status{k8s_cluster="internal", value="ready"} > 0
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: WAL archiving is stuck for {{ $labels.namespace }}/{{ $labels.pod }}
                description: '{{ $value }} WAL segment(s) have been waiting to upload to the object store for 15 minutes.
                  Point-in-time recovery stops advancing, and WAL keeps accumulating on the WAL volume until Postgres halts.
                  Check the plugin-barman-cloud sidecar logs and the S3 credentials.'
            - alert: CNPGWALVolumeFilling
              expr: (kubelet_volume_stats_used_bytes{k8s_cluster="internal", persistentvolumeclaim=~".+-[0-9]+-wal"} / kubelet_volume_stats_capacity_bytes{k8s_cluster="internal",
                persistentvolumeclaim=~".+-[0-9]+-wal"}) > 0.80
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: WAL volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage
                  }} full
                description: Postgres stops accepting writes when its WAL volume is full. This usually means WAL archiving
                  is failing; see CNPGWALArchivingStuck.
            - alert: CNPGDataVolumeFilling
              expr: (kubelet_volume_stats_used_bytes{k8s_cluster="internal", persistentvolumeclaim=~".+-cnpg-.+-[0-9]+"} / kubelet_volume_stats_capacity_bytes{k8s_cluster="internal",
                persistentvolumeclaim=~".+-cnpg-.+-[0-9]+"}) > 0.85
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: Postgres data volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage
                  }} full
                description: Above 85% for 30 minutes. Increase cnpg.main.cluster.storage.size in the app's HelmRelease.
            - alert: CNPGBackupStale
              expr: (time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{k8s_cluster="internal"}) > 93600
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: No successful base backup for {{ $labels.namespace }}/{{ $labels.pod }} in {{ $value | humanizeDuration
                  }}
                description: Base backups are scheduled daily; the most recent successful one is over 26 hours old.
            - alert: CNPGBackupFailed
              expr: barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{k8s_cluster="internal"} > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{k8s_cluster="internal"}
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: The latest base backup for {{ $labels.namespace }}/{{ $labels.pod }} failed
                description: The most recent backup attempt failed after the last successful one. Check the Backup resources
                  in {{ $labels.namespace }} and the plugin-barman-cloud sidecar logs.
          - name: estate-availability
            interval: 60s
            rules:
            - alert: ClusterMetricsAbsent
              expr: absent_over_time(up{k8s_cluster="core"}[10m])
              for: 5m
              labels:
                severity: critical
                k8s_cluster: core
              annotations:
                summary: No metrics from the core cluster
                description: VictoriaMetrics has received no samples from core for over 10 minutes. The cluster may be down,
                  or its remote-write link to core may be broken. Centrally-evaluated alerts for core are not firing while
                  this is true.
            - alert: ClusterMetricsAbsent
              expr: absent_over_time(up{k8s_cluster="internal"}[10m])
              for: 5m
              labels:
                severity: critical
                k8s_cluster: internal
              annotations:
                summary: No metrics from the internal cluster
                description: VictoriaMetrics has received no samples from internal for over 10 minutes. The cluster may be
                  down, or its remote-write link to core may be broken. Centrally-evaluated alerts for internal are not firing
                  while this is true.
            - alert: ClusterMetricsAbsent
              expr: absent_over_time(up{k8s_cluster="staging"}[10m])
              for: 5m
              labels:
                severity: critical
                k8s_cluster: staging
              annotations:
                summary: No metrics from the staging cluster
                description: VictoriaMetrics has received no samples from staging for over 10 minutes. The cluster may be
                  down, or its remote-write link to core may be broken. Centrally-evaluated alerts for staging are not firing
                  while this is true.
            - alert: ClusterMetricsAbsent
              expr: absent_over_time(up{k8s_cluster="production"}[10m])
              for: 5m
              labels:
                severity: critical
                k8s_cluster: production
              annotations:
                summary: No metrics from the production cluster
                description: VictoriaMetrics has received no samples from production for over 10 minutes. The cluster may
                  be down, or its remote-write link to core may be broken. Centrally-evaluated alerts for production are not
                  firing while this is true.
          - name: estate-disk
            interval: 60s
            rules:
            - alert: NodeDiskUsageHigh
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|ramfs|squashfs",mountpoint!~"/var/lib/kubelet/.*|/run/.*"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|ramfs|squashfs",mountpoint!~"/var/lib/kubelet/.*|/run/.*"})
                > 0.70
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: '{{ $labels.k8s_cluster }}/{{ $labels.instance }} {{ $labels.mountpoint }} is {{ $value | humanizePercentage
                  }} full'
                description: Sustained above 70% for an hour. The bundled NodeFilesystem alerts only fire above 95% or on
                  a rising predict_linear slope, so a filesystem that ratchets up and then plateaus stays invisible to them.
            - alert: NodeDiskUsageCritical
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|ramfs|squashfs",mountpoint!~"/var/lib/kubelet/.*|/run/.*"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|ramfs|squashfs",mountpoint!~"/var/lib/kubelet/.*|/run/.*"})
                > 0.85
              for: 30m
              labels:
                severity: critical
              annotations:
                summary: '{{ $labels.k8s_cluster }}/{{ $labels.instance }} {{ $labels.mountpoint }} is {{ $value | humanizePercentage
                  }} full'
                description: Above 85% for 30 minutes. On the 18.3 GiB control-plane nodes this is roughly 2.5 GiB of headroom
                  before disk-pressure evictions.
