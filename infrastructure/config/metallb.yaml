---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ip-address-pool
  namespace: metallb-system
spec:
  addresses:
    - ${METALLB_POOL_CIDR}

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: private-l2advert
  namespace: metallb-system
spec:
  ipAddressPools:
    - ip-address-pool
