---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data
  namespace: forgejo-runner
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 1000
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:9
          command:
            - sh
            - -c
            - |
              set -e
              while [ ! -S /var/run/docker.sock ]; do
                echo "waiting for the docker daemon..."
                sleep 2
              done
              if [ ! -f /data/.runner ]; then
                echo "registering with ${FORGEJO_INSTANCE_URL}"
                forgejo-runner register --no-interactive \
                  --config /config/config.yaml \
                  --instance "${FORGEJO_INSTANCE_URL}" \
                  --token "${RUNNER_TOKEN}" \
                  --name "${RUNNER_NAME}" \
                  --labels "ubuntu-latest:docker://catthehacker/ubuntu:act-22.04,ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04"
              else
                echo "already registered; starting the daemon"
              fi
              exec forgejo-runner daemon --config /config/config.yaml
          env:
            - name: FORGEJO_INSTANCE_URL
              value: http://forgejo-http.forgejo.svc.cluster.local:3000
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-token
                  key: token
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: docker-socket
              mountPath: /var/run
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        - name: dind
          image: docker:28-dind
          args:
            - --mtu=1450
            - --default-network-opt
            - bridge=com.docker.network.driver.mtu=1450
            - --group=1000
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          volumeMounts:
            - name: docker-certs-ca
              mountPath: /certs/ca
            - name: docker-certs-client
              mountPath: /certs/client
            - name: docker-socket
              mountPath: /var/run
            - name: docker-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 6Gi
          livenessProbe:
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: docker-certs-ca
          emptyDir: {}
        - name: docker-certs-client
          emptyDir: {}
        - name: docker-socket
          emptyDir: {}
        - name: docker-storage
          emptyDir: {}
